services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
#      - pgdata:/var/lib/postgresql/data
      - "../../volumes/db:/var/lib/postgresql/data"
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 2
    networks:
      - all-masters-net

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    volumes:
      #- redisdata:/data
      - "../../volumes/redis:/data"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - all-masters-net

  app:
    container_name: all-masters-app
#    build: .#
    build:
      context: ..            # корень проекта
      dockerfile: build/Dockerfile
    volumes:
      - "../../volumes/logs:/app/logs"
      - "../../volumes/images/avatars:/app/images/avatars"
      - "../../volumes/images/collages:/app/images/collages"
      - "../../volumes/images/defaults:/app/images/defaults"
      - "../../volumes/images/new_avatars:/app/images/new_avatars"
      - "../../volumes/images/new_collages:/app/images/new_collages"
      - "../../volumes/images/new_works:/app/images/new_works"
      - "../../volumes/images/works:/app/images/works"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - all-masters-net

#Использование сети, созданной ранее
networks:
  all-masters-net:
    external: true
    name: all-masters-net

